# The Node floor check (#20): tools.node in dependencies.yaml admits only Node versions every package of
# the lang.typescript pins runs on (their engines.node, at the latest versions and at the floors), and no
# Node line past its end of life.
name: node-check
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: checks/node.sh
