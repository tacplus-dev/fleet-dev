# The dev fleet for the new design: doppelganger as the proving ground.
# Jody, 2026-10-23: a deployment repo per fleet; every service states the
# implementation it runs; the registries decide names and ids and say where
# each contract (proto) lives. Every implementation here is a tacplus-dev repo.
# operator is not listed: it is a library (Jody, 2026-10-23) this deployment
# repo will build its own operator from, against build/proto.
registries:
  - https://github.com/tacplus-dev/registry.git
tacplus: "2.2"
services:
  - name: kernel
    repo: https://github.com/tacplus-dev/kernel.git
  - name: opa
    repo: https://github.com/tacplus-dev/opa.git
  - name: gateway
    repo: https://github.com/tacplus-dev/gateway.git
  - name: stratum
    repo: https://github.com/tacplus-dev/stratum.git
  - name: eventbus
    repo: https://github.com/tacplus-dev/eventbus.git
  - name: kmaker
    repo: https://github.com/tacplus-dev/kmaker.git
  - name: oauth
    repo: https://github.com/tacplus-dev/oauth.git
  - name: letsencrypt
    repo: https://github.com/tacplus-dev/letsencrypt.git
  - name: blobstore
    repo: https://github.com/tacplus-dev/blobstore.git
  - name: messaging
    repo: https://github.com/tacplus-dev/messaging.git
  - name: mailbox
    repo: https://github.com/tacplus-dev/mailbox.git
  - name: llmproxy
    repo: https://github.com/tacplus-dev/llmproxy.git
  - name: doppelganger
    repo: https://github.com/tacplus-dev/doppelganger.git
