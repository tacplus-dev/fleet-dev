# The shaded-jar check (#17, docs/java-plugins.md): a jar shaded with the pinned maven-shade-plugin
# and the plexus-utils override still builds and runs, and the plugin runs on plexus-utils 3.6.1.
name: shade-check
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  shade-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: checks/shade.sh
