# The Node floor check (#20): tools.node in dependencies.yaml admits only Node versions every package of
# the lang.typescript pins runs on (their engines.node, at the latest versions and at the floors), and no
# Node line past its end of life.
name: node-check
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: checks/node.sh
