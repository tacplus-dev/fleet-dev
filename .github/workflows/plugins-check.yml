# The plugin realm check (#18, docs/java-plugins.md): maven-antrun-plugin (with its plexus-utils
# override), exec-maven-plugin and build-helper-maven-plugin, at the pinned versions, run on no
# plexus-utils or commons-io a known advisory affects.
name: plugins-check
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  plugins-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: checks/plugins.sh
